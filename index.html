<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <link rel="stylesheet" href="index.css">

</head>

<body>
   
        <!-- ####### AGE ######### -->
        <h3>Age to Days Converter</h3>
        <input type="number" id="age" placeholder="Enter your age">
        <button onclick="convertAge()">Convert</button>
        <p id="daysResult"></p>

        <!-- ####### HOURS TO SECONDS ######### -->
        <h3>Hours to Seconds Converter</h3>
        <input type="number" id="hours" placeholder="Enter hours">
        <button onclick="convertHours()">Convert</button>
        <p id="secondsResult"></p>


        <!-- ####### NEXT NUM IN ARRAY ######### -->
        <h3>Next Number in Array</h3>

        <h3>Next Number Finder (Single Input)</h3>
        <input type="text" id="userNumber" placeholder="Enter a number">
        <button onclick="findNextNumber()">Find Next</button>
        <p id="nextNumber"></p>


        <!-- ####### CAPITALIZATION ######### -->
        <h3>Capitalize Name</h3>
        <input type="text" id="userName" placeholder="Enter your name in lowercase">
        <button onclick="capitalizeName()">Convert</button>
        <p id="nameResult"></p>


        <!-- ####### BMI ######### -->
        <h3>BMI Calculator</h3>
        <input type="number" id="weight" placeholder="Weight (kg)">
        <input type="number" id="height" placeholder="Height (m)">
        <button onclick="calculateBMI()">Calculate</button>
        <p id="bmiResult"></p>


        <!-- ####### Addition with Event Handling ######### -->
        <h3>Addition with Event Handling</h3>
        <label>Enter First Number </label>
        <input type="number" id="num1"><br><br>

        <label>Enter Second Number </label>
        <input type="number" id="num2"><br><br>

        <label>Result </label>
        <input type="text" id="result" readonly><br><br>

        <script src="./age.js"></script>
        <script src="./additionevent.js"></script>
        <script src="./array.js"></script>
        <script src="./bmi.js"></script>
        <script src="./index.html"></script>
        <script src="./time.js"></script>
        <script src="./capitalname.js"></script>
</body>

</html>
